kd_type: stage_adaptive
# kd_lambda is intentionally NOT set here: it is calibrated per method by
# tools/calibrate_lambda.py and passed via --kd-lambda from
# scripts/run_ablation.sh. A value here would contradict the CLI flag and
# the guard in train_kd.py would (correctly) refuse to run.
temperature: 4    # for the logit component
alpha: 0.5        # attention weight within the feature component
# total_epochs is set automatically from training config
