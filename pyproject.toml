[project]
name = "rt-detr-kd"
version = "1.0.0"
description = "Systematic knowledge distillation study for RT-DETR (real-time detection transformers)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Umut Onur Yasar" }]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pycocotools",
    "pyyaml",
    "tensorboard",
    "scipy",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]
serve = ["fastapi", "uvicorn", "python-multipart"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- CUDA-pinned PyTorch wheels ---
# Change cu121 -> cu118 (both this block's index name/url) if `nvidia-smi`
# reports a CUDA version below 12.1.
[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
